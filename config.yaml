# 通知配置：channel = telegram | serverchan | none
notify:
  channel: serverchan
  telegram:
    token_env: TG_TOKEN
    chat_id_env: TG_CHAT_ID
  serverchan:
    key_env: SERVERCHAN_KEY

# 请求重试
retry:
  attempts: 3
  backoff_seconds: 2

sites:
  acy7:
    enabled: true
    type: acy7
    base_url: https://acy7.com
    accounts:
      - name: main
        user_env: ACY7_USER
        pass_env: ACY7_PASS

  workbuddy:
    enabled: true
    type: workbuddy
    # WorkBuddy 即 CodeBuddy（腾讯云 AI 代码助手）
    # 签到 API 直接调用 copilot.tencent.com，需从桌面客户端提取 access token
    base_url: https://www.codebuddy.cn
    accounts:
      # WorkBuddy 用手机号+验证码/微信扫码登录，CI 无法自动登录。
      # 需从 WorkBuddy 桌面客户端提取 access token：
      #   客户端登录后，token 存于
      #   %LOCALAPPDATA%\CodeBuddyExtension\Data\Public\auth\workbuddy-desktop.info
      #   取其中 auth.accessToken 的值，填入对应 Secrets。
      # token 有效期约 1 年，过期需重新登录客户端提取。
      - name: "1780293"
        token_env: WB1_TOKEN
      - name: "1920293"
        token_env: WB2_TOKEN

  trae:
    enabled: true
    type: trae
    # TRAE 桌面客户端积分签到
    # 签到 API 直接调用 api.trae.cn，每个账号必须使用自己的 token 和设备 ID。
    base_url: https://api.trae.cn
    accounts:
      # refresh token 和 telemetry.devDeviceId 均从对应账号已登录的客户端获取。
      # 两个账号的认证信息不可混用，否则可能返回 401。
      - name: "1780293"
        token_env: TRAE1_TOKEN
        device_env: TRAE1_DEVICE_ID
      - name: "1920293"
        token_env: TRAE2_TOKEN
        device_env: TRAE2_DEVICE_ID
      # 第三个账号（切换工具槽位 3）。name 仅用于通知显示，可改成手机号。
      - name: "账号3"
        token_env: TRAE3_TOKEN
        device_env: TRAE3_DEVICE_ID
