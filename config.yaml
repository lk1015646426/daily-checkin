# 通知配置：channel = telegram | serverchan | none
notify:
  channel: serverchan
  telegram:
    token_env: TG_TOKEN
    chat_id_env: TG_CHAT_ID
  serverchan:
    key_env: SERVERCHAN_KEY

# 请求重试
retry:
  attempts: 3
  backoff_seconds: 2

sites:
  acy7:
    enabled: true
    type: acy7
    base_url: https://acy7.com
    accounts:
      - name: main
        user_env: ACY7_USER
        pass_env: ACY7_PASS

  workbuddy:
    enabled: true
    type: workbuddy
    # WorkBuddy 即 CodeBuddy（腾讯云 AI 代码助手）
    # 签到 API 直接调用 copilot.tencent.com，需从桌面客户端提取 access token
    base_url: https://www.codebuddy.cn
    accounts:
      # WorkBuddy 用手机号+验证码/微信扫码登录，CI 无法自动登录。
      # 需从 WorkBuddy 桌面客户端提取 access token：
      #   客户端登录后，token 存于
      #   %LOCALAPPDATA%\CodeBuddyExtension\Data\Public\auth\workbuddy-desktop.info
      #   取其中 auth.accessToken 的值，填入对应 Secrets。
      # token 有效期约 1 年，过期需重新登录客户端提取。
      - name: "1780293"
        token_env: WB1_TOKEN
      - name: "1920293"
        token_env: WB2_TOKEN

  trae:
    enabled: true
    type: trae
    # TRAE 桌面客户端积分签到
    # 签到 API 直接调用 api.trae.cn，每个账号必须使用自己的 token 和设备 ID。
    base_url: https://api.trae.cn
    # 云端自主续期（ExchangeToken）所需的本机设备上下文（2026-09-08 实测值；
    # client_version 需与 TRAE 客户端 product.json 的 appVersion 保持一致）。
    device_info:
      platform_code: SOLO_PC
      device_name: "10156的电脑"
      device_model: "INVA"
      device_brand: "LENOVO"
      device_cpu: "AMD Ryzen 5 6600H with Radeon Graphics"
      os_info: "windows"
      os_version: "Windows 11 Home China"
      client_version: "0.1.63"
    accounts:
      # token、数字 auth_device_id 和设备上下文均由切换工具从官方客户端快照同步。
      # 两个账号的认证信息不可混用，否则可能返回 401。
      # 2026-09-09 起只保留尾号 0293 的两个账号，其余账号已从切换工具移除。
      - name: "1780293"
        token_env: A_1780293_TOKEN
        refresh_env: A_1780293_REFRESH_JSON
        device_env: A_1780293_DEVICE_ID
        device_brand_env: A_1780293_DEVICE_BRAND
        device_type_env: A_1780293_DEVICE_TYPE
      - name: "1920293"
        token_env: A_1920293_TOKEN
        refresh_env: A_1920293_REFRESH_JSON
        device_env: A_1920293_DEVICE_ID
        device_brand_env: A_1920293_DEVICE_BRAND
        device_type_env: A_1920293_DEVICE_TYPE
