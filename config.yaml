# 通知配置：channel = telegram | serverchan | none
notify:
  channel: serverchan
  telegram:
    token_env: TG_TOKEN
    chat_id_env: TG_CHAT_ID
  serverchan:
    key_env: SERVERCHAN_KEY

# 请求重试
retry:
  attempts: 3
  backoff_seconds: 2

sites:
  acy7:
    enabled: true
    type: acy7
    base_url: https://acy7.com
    accounts:
      - name: main
        user_env: ACY7_USER
        pass_env: ACY7_PASS

  workbuddy:
    enabled: true
    type: workbuddy
    # WorkBuddy 即 CodeBuddy（腾讯云 AI 代码助手）
    # 签到 API 直接调用 copilot.tencent.com，需从桌面客户端提取 access token
    base_url: https://www.codebuddy.cn
    accounts:
      # WorkBuddy 用手机号+验证码/微信扫码登录，CI 无法自动登录。
      # 需从 WorkBuddy 桌面客户端提取 access token：
      #   客户端登录后，token 存于
      #   %LOCALAPPDATA%\CodeBuddyExtension\Data\Public\auth\workbuddy-desktop.info
      #   取其中 auth.accessToken 的值，填入对应 Secrets。
      # token 有效期约 1 年，过期需重新登录客户端提取。
      - name: "1780293"
        token_env: WB1_TOKEN
      - name: "1920293"
        token_env: WB2_TOKEN

  trae:
    enabled: true
    type: trae
    # TRAE 桌面客户端积分签到
    # 签到 API 直接调用 api.trae.cn，每个账号必须使用自己的 token 和设备 ID。
    base_url: https://api.trae.cn
    accounts:
      # token、数字 auth_device_id 和设备上下文均由切换工具从官方客户端快照同步。
      # 两个账号的认证信息不可混用，否则可能返回 401。
      - name: "1780293"
        token_env: A_1780293_TOKEN
        device_env: A_1780293_DEVICE_ID
        device_brand_env: A_1780293_DEVICE_BRAND
        device_type_env: A_1780293_DEVICE_TYPE
      - name: "1920293"
        token_env: A_1920293_TOKEN
        device_env: A_1920293_DEVICE_ID
        device_brand_env: A_1920293_DEVICE_BRAND
        device_type_env: A_1920293_DEVICE_TYPE
      # 槽位 3：刘浩17721。name 与切换工具账号备注一致，仅用于通知显示。
      - name: "刘浩17721"
        token_env: A_17721_TOKEN
        device_env: A_17721_DEVICE_ID
        device_brand_env: A_17721_DEVICE_BRAND
        device_type_env: A_17721_DEVICE_TYPE
      # 槽位 4：1807095。各账号 device_id 必须互不相同，否则服务端按同设备去重。
      - name: "1807095"
        token_env: A_1807095_TOKEN
        device_env: A_1807095_DEVICE_ID
        device_brand_env: A_1807095_DEVICE_BRAND
        device_type_env: A_1807095_DEVICE_TYPE
      # 槽位 5：新注册账号，切换工具显示名为“用户4028161677”。
      - name: "用户4028161677"
        token_env: A_4028161677_TOKEN
        device_env: A_4028161677_DEVICE_ID
        device_brand_env: A_4028161677_DEVICE_BRAND
        device_type_env: A_4028161677_DEVICE_TYPE
  zhipu:
    enabled: true
    type: zhipu
    # 智谱清言（chatglm.cn）每日登录积分。
    # 账号与 API Key 由切换工具同步到 GitHub Secret ZHIPU_ACCOUNTS_JSON，
    # 聚合 Secret 存在时覆盖下方 accounts（本地开发用 token_env 回退）。
    base_url: https://chatglm.cn
    # 签到端点已实现（signers/zhipu.py 直连 daily_login_score，抓包验证于 2026-09-08）。
    # token 由切换工具从清言桌面客户端 Cookie 同步（ZHIPU_ACCOUNTS_JSON）。
    # 云端每次签到前用 refresh_token 自动换新 access token（refresh 约 180 天有效
    # 且不轮换），本地无需每天打开工具。
    accounts:
      - name: main
        token_env: ZHIPU_TOKEN
        refresh_token_env: ZHIPU_REFRESH_TOKEN
