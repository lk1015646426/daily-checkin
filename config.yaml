# 通知配置：channel = telegram | serverchan | none
notify:
  channel: serverchan
  telegram:
    token_env: TG_TOKEN
    chat_id_env: TG_CHAT_ID
  serverchan:
    key_env: SERVERCHAN_KEY

# 请求重试
retry:
  attempts: 3
  backoff_seconds: 2

sites:
  acy7:
    enabled: true
    type: acy7
    base_url: https://acy7.com
    accounts:
      - name: main
        user_env: ACY7_USER
        pass_env: ACY7_PASS

  workbuddy:
    enabled: true
    type: workbuddy
    # WorkBuddy 即 CodeBuddy（腾讯云 AI 代码助手），网页登录/应用入口
    base_url: https://www.codebuddy.cn
    # 登录表单选择器（按实际页面调整）
    login:
      user_selector: "input[type=text], input[name=username], input[placeholder*=账号], input[autocomplete=username]"
      pass_selector: "input[type=password], input[name=password]"
      submit_selector: "button[type=submit], button:has-text('登录'), button:has-text('Sign')"
    # 签到按钮选择器（来自社区 Playwright 方案）
    checkin:
      menu_selector: ".user-menu"
      button_selector: ".daily-checkin-banner-action"
      button_text: "立即领取"
    accounts:
      # WorkBuddy 用手机号+验证码/微信扫码登录，CI 无法自动登录。
      # 请本机运行 scripts/capture_workbuddy_token.py 取登录态 cookies，
      # 将输出的 JSON 整段填入对应 Secrets。
      - name: acc1
        cookies_env: WB1_COOKIES
      - name: acc2
        cookies_env: WB2_COOKIES
