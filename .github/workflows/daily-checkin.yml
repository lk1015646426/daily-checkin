name: Daily Checkin

on:
  schedule:
    # 每天 20:00 UTC = 次日北京时间 04:00
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      account_filter:
        description: "可选，格式为站点:账号名或稳定 ID，例如 trae:1780293、workbuddy:wb-7f3a8c91d2e4、zhipu:zp-1a2b3c4d5e6f"
        required: false
        default: ""

concurrency:
  group: daily-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 每次运行使用唯一键；只从 v2 前缀恢复，避免复用旧版缓存。
      # restore 与 save 分离：save 步骤 if: always()，个别账号签到失败（job exit 1）
      # 也不丢 refresh 轮换链（tokens.json），否则断链后 401 只能重新种 Secret。
      - name: Restore token cache
        uses: actions/cache/restore@v4
        with:
          path: store
          key: signin-token-cache-v2-${{ github.run_id }}
          restore-keys: |
            signin-token-cache-v2-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run checkin
        env:
          CHECKIN_ACCOUNT_FILTER: ${{ github.event.inputs.account_filter || '' }}
          ACY7_USER: ${{ secrets.ACY7_USER }}
          ACY7_PASS: ${{ secrets.ACY7_PASS }}
          WB1_TOKEN: ${{ secrets.WB1_TOKEN }}
          WB2_TOKEN: ${{ secrets.WB2_TOKEN }}
          WORKBUDDY_ACCOUNTS_JSON: ${{ secrets.WORKBUDDY_ACCOUNTS_JSON }}
          ZHIPU_ACCOUNTS_JSON: ${{ secrets.ZHIPU_ACCOUNTS_JSON }}
          A_1780293_REFRESH_JSON: ${{ secrets.A_1780293_REFRESH_JSON }}
          A_1920293_REFRESH_JSON: ${{ secrets.A_1920293_REFRESH_JSON }}
          A_1780293_TOKEN: ${{ secrets.A_1780293_TOKEN }}
          A_1780293_DEVICE_ID: ${{ secrets.A_1780293_DEVICE_ID }}
          A_1780293_DEVICE_BRAND: ${{ secrets.A_1780293_DEVICE_BRAND }}
          A_1780293_DEVICE_TYPE: ${{ secrets.A_1780293_DEVICE_TYPE }}
          A_1920293_TOKEN: ${{ secrets.A_1920293_TOKEN }}
          A_1920293_DEVICE_ID: ${{ secrets.A_1920293_DEVICE_ID }}
          A_1920293_DEVICE_BRAND: ${{ secrets.A_1920293_DEVICE_BRAND }}
          A_1920293_DEVICE_TYPE: ${{ secrets.A_1920293_DEVICE_TYPE }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python main.py

      - name: Save token cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: store
          key: signin-token-cache-v2-${{ github.run_id }}
