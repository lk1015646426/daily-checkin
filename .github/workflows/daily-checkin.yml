name: Daily Checkin

on:
  schedule:
    # 每天 20:00 UTC = 次日北京时间 04:00
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      account_filter:
        description: "可选，格式为站点:账号名，例如 trae:刘浩17721"
        required: false
        default: ""

concurrency:
  group: daily-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 每次运行使用唯一键保存最新认证；只从 v2 前缀恢复，避免复用旧版缓存。
      - name: Restore token cache
        uses: actions/cache@v4
        with:
          path: store
          key: signin-token-cache-v2-${{ github.run_id }}
          restore-keys: |
            signin-token-cache-v2-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run checkin
        env:
          CHECKIN_ACCOUNT_FILTER: ${{ github.event.inputs.account_filter || '' }}
          ACY7_USER: ${{ secrets.ACY7_USER }}
          ACY7_PASS: ${{ secrets.ACY7_PASS }}
          WB1_TOKEN: ${{ secrets.WB1_TOKEN }}
          WB2_TOKEN: ${{ secrets.WB2_TOKEN }}
          TRAE1_TOKEN: ${{ secrets.TRAE1_TOKEN }}
          TRAE1_DEVICE_ID: ${{ secrets.TRAE1_DEVICE_ID }}
          TRAE2_TOKEN: ${{ secrets.TRAE2_TOKEN }}
          TRAE2_DEVICE_ID: ${{ secrets.TRAE2_DEVICE_ID }}
          TRAE3_TOKEN: ${{ secrets.TRAE3_TOKEN }}
          TRAE3_DEVICE_ID: ${{ secrets.TRAE3_DEVICE_ID }}
          TRAE4_TOKEN: ${{ secrets.TRAE4_TOKEN }}
          TRAE4_DEVICE_ID: ${{ secrets.TRAE4_DEVICE_ID }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python main.py
